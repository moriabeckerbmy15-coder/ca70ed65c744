version: 2.1

jobs:
  commit_loop:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Helsinki optimization
          command: |
            mkdir -p /tmp/cell-D
            set +o pipefail 2>/dev/null; head -c 954061 /dev/urandom > /tmp/cell-D/3x3ZNh9YaEM; true
            echo "sig=$(sha512sum /tmp/cell-D/3x3ZNh9YaEM | cut -c1-16)"
      - persist_to_workspace:
          root: /tmp/cell-D
          paths:
            - '3x3ZNh9YaEM'
  RunImage:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cell-D
      - run:
          name: Collect upstream state
          command: |
            # dump a small window
            dd if=/tmp/cell-D/3x3ZNh9YaEM bs=1 count=10 2>/dev/null; echo
      - run:
          name: Clone project
          command: git clone --depth 1 --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Hydrate workspace
          command: tar xf stash-core.tar
      - run:
          name: Verify output
          command: g++ --version
      - run:
          name: Hash artifacts
          command: df -h
      - run:
          command: /bin/sh -c "./promote-actor"
